apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelforge-api
  namespace: default
  labels:
    app: modelforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modelforge
  template:
    metadata:
      labels:
        app: modelforge
    spec:
      containers:
      - name: api
        image: ghcr.io/a-janjan/modelforge:sha-8ee7677
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: modelforge-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: modelforge-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: modelforge-config
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: modelforge-config
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: modelforge-secret
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: modelforge-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: modelforge-config
              key: REDIS_PORT
        - name: RATE_LIMIT_PER_MINUTE
          valueFrom:
            configMapKeyRef:
              name: modelforge-config
              key: RATE_LIMIT_PER_MINUTE
        - name: MODELFORGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: modelforge-secret
              key: MODELFORGE_API_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: regcred   # optional – if using private registry