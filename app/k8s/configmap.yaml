apiVersion: v1
kind: ConfigMap
metadata:
  name: modelforge-config
  namespace: default
data:
  POSTGRES_HOST: "postgres-service"   # will be the service name if you run PostgreSQL in cluster
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "modelforge"
  POSTGRES_DB: "modelforge"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  RATE_LIMIT_PER_MINUTE: "5"